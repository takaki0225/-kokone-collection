<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7fb"><title>KOKONE Collection</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f7f7fb;color:#202124}main{max-width:720px;margin:auto;padding:24px 16px 80px}h1{font-size:26px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.muted{color:#777;font-size:13px}.badge{display:inline-block;background:#eee;border-radius:999px;padding:4px 9px;margin:2px;font-size:12px}.cuts button{border:0;border-radius:999px;padding:8px 11px;margin:4px;background:#eee}.cuts button.owned{background:#dff5e5}#err{color:#b00020}</style></head><body><main><h1>KOKONE Collection</h1><div id="summary" class="card">読み込み中…</div><div id="err"></div><h2>最近の追加</h2><div id="list"></div><h2>発売予定</h2><div id="pending"></div></main><script>
const KEY='kokone-owned-v2', CACHE='kokone-master-cache-v1'; let owned=JSON.parse(localStorage.getItem(KEY)||'{}');
function key(s,c){return s.id+'::'+c} function toggle(s,c,b){owned[key(s,c)]=!owned[key(s,c)];localStorage.setItem(KEY,JSON.stringify(owned));b.classList.toggle('owned',owned[key(s,c)]);b.textContent=c+(owned[key(s,c)]?' ✓':'')}
function card(s){let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+s.name+'</b><div class="muted">'+s.saleDate+' ・ '+s.channel+' ・ '+s.count+'種 ・ 信頼度'+s.confidence+'</div>';let cuts=document.createElement('div');cuts.className='cuts';s.cuts.forEach(c=>{let b=document.createElement('button');b.textContent=c+(owned[key(s,c)]?' ✓':'');if(owned[key(s,c)])b.className='owned';b.onclick=()=>toggle(s,c,b);cuts.appendChild(b)});d.appendChild(cuts);return d}
function render(m){document.getElementById('summary').innerHTML='<b>'+m.member+'</b><br>'+m.totals.series+'シリーズ / '+m.totals.photoTypes+'種類<div class="muted">マスター更新: '+m.version+'</div>';for(const s of m.recent)document.getElementById('list').appendChild(card(s));for(const s of m.pending)document.getElementById('pending').appendChild(card(s))}
(async()=>{try{let r=await fetch('./master.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;let m=await r.json();localStorage.setItem(CACHE,JSON.stringify(m));render(m)}catch(e){let c=localStorage.getItem(CACHE);if(c){render(JSON.parse(c));document.getElementById('err').textContent='オフラインのため前回データを表示しています'}else document.getElementById('err').textContent='マスターを読み込めませんでした'}})();
</script></body></html>
