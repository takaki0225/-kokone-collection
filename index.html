<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7fb"><title>KOKONE Collection</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 90px}h1{font-size:25px;margin:8px 0}.sub{color:#777;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0000000d}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:21px}.tools{position:sticky;top:0;background:#f7f7fbdd;backdrop-filter:blur(10px);padding:8px 0;z-index:3}input,select{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;background:white;font-size:16px;margin:4px 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card{padding:14px;margin:10px 0}.title{font-weight:700}.meta{font-size:12px;color:#777;margin:5px 0 9px}.new{background:#fff1bd;color:#765b00;border-radius:999px;padding:2px 7px;font-size:11px;margin-left:5px}.cuts{display:flex;flex-wrap:wrap;gap:6px}.cut{border:0;border-radius:999px;padding:8px 10px;font-size:12px;background:#eee}.s1{background:#dff5e5}.s2{background:#fff0c9}.s3{background:#e7e1ff}.pending{border:1px dashed #aaa}.empty{text-align:center;color:#777;padding:30px}.foot{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;padding:9px;text-align:center;font-size:12px}.err{color:#b00020;font-size:12px}
</style></head><body><main><h1>KOKONE Collection</h1><div class="sub" id="updated">マスター読込中…</div><div class="stats"><div class="stat"><b id="ser">-</b>シリーズ</div><div class="stat"><b id="types">-</b>種類</div><div class="stat"><b id="owned">-</b>入手済</div></div><div class="tools"><input id="q" placeholder="シリーズ名・カットを検索"><div class="filters"><select id="year"><option value="">全年</option><option>2025</option><option>2026</option></select><select id="channel"><option value="">全区分</option><option>WebShop</option><option>会場</option><option>CD</option><option>乃木コレ</option><option>映像</option></select></div><label><input id="missing" type="checkbox" style="width:auto"> 未入手を含むシリーズだけ表示</label></div><div id="err" class="err"></div><div id="list"></div><h2>発売予定</h2><div id="pending"></div></main><div class="foot">タップ：未入手 → 交換予定 → 入手済 → 未入手</div><script>
const STORE='kokone-status-v3',CACHE='kokone-master-cache-v2';let master,status={};const labels=['未入手','交換予定','入手済'];
function normalize(m){if(m.series?.length&&Array.isArray(m.series[0]))m.series=m.series.map(a=>({id:a[0],year:a[1],month:a[2],channel:a[3],name:a[4],cuts:a[5].map(c=>({name:c[0],baselineStatus:c[1]?'入手済':'未入手'})),confidence:a[6],isNew:!!a[7]}));return m}
function k(s,c){return s.id+'::'+c.name}function st(s,c){return status[k(s,c)]??(c.baselineStatus==='入手済'?2:0)}function cls(n){return n?(' s'+n):''}function save(){localStorage.setItem(STORE,JSON.stringify(status));stats()}
function stats(){if(!master)return;let n=0;master.series.forEach(s=>s.cuts.forEach(c=>{if(st(s,c)===2)n++}));owned.textContent=n}
function cutBtn(s,c){let b=document.createElement('button'),n=st(s,c);b.className='cut'+cls(n);b.textContent=c.name+'・'+labels[n];b.onclick=()=>{let x=(st(s,c)+1)%3;status[k(s,c)]=x;save();b.className='cut'+cls(x);b.textContent=c.name+'・'+labels[x];if(missing.checked)render()};return b}
function card(s){let d=document.createElement('div');d.className='card';d.innerHTML='<div class="title">'+s.name+(s.isNew?'<span class="new">NEW</span>':'')+'</div><div class="meta">'+s.month+' ・ '+s.channel+' ・ '+s.cuts.length+'種'+(s.confidence?' ・ 信頼度'+s.confidence:'')+'</div>';let x=document.createElement('div');x.className='cuts';s.cuts.forEach(c=>x.appendChild(cutBtn(s,c)));d.appendChild(x);let comp=document.createElement('button');comp.className='cut';comp.style='margin-top:10px;font-weight:700';comp.textContent='コンプ';comp.onclick=()=>{s.cuts.forEach(c=>status[k(s,c)]=2);save();render()};d.appendChild(comp);return d}
function render(){let text=q.value.trim().toLowerCase(),y=year.value,ch=channel.value;list.innerHTML='';let a=master.series.filter(s=>(!y||String(s.year)===y)&&(!ch||s.channel.includes(ch))&&(!text||(s.name+' '+s.cuts.map(c=>c.name).join(' ')).toLowerCase().includes(text))&&(!missing.checked||s.cuts.some(c=>st(s,c)!==2)));a.sort((a,b)=>(b.month+b.id).localeCompare(a.month+a.id));a.forEach(s=>list.appendChild(card(s)));if(!a.length)list.innerHTML='<div class="empty">該当なし</div>';stats()}
function pendingRender(){pending.innerHTML='';(master.pending||[]).forEach(s=>{let d=document.createElement('div');d.className='card pending';d.innerHTML='<div class="title">'+s.name+'</div><div class="meta">'+s.saleDate+' ・ '+s.channel+' ・ '+s.count+'種 ・ '+s.status+' ・ 信頼度'+s.confidence+'</div><div>'+s.cuts.join(' → ')+'</div>';pending.appendChild(d)})}
async function load(){try{let r=await fetch('./master.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);master=normalize(await r.json());localStorage.setItem(CACHE,JSON.stringify(master))}catch(e){let c=localStorage.getItem(CACHE);if(!c){err.textContent='マスターを読み込めませんでした';return}master=normalize(JSON.parse(c));err.textContent='オフラインのため前回取得したマスターを表示しています'}status=JSON.parse(localStorage.getItem(STORE)||'{}');ser.textContent=master.totals.series;types.textContent=master.totals.photoTypes;updated.textContent='愛宕心響 ・ マスター更新 '+master.version;render();pendingRender()}
[q,year,channel,missing].forEach(e=>e.addEventListener(e===q?'input':'change',render));load();
</script></body></html>
